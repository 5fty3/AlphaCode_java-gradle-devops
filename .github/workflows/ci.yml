name: Java Gradle CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Build application
        run: ./gradlew build

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v6
        with:
          name: java-gradle-app
          path: build/libs/*.jar

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v7
        with:
          name: java-gradle-app
          path: app

      - name: Check GitHub identity
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"     

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::952652904046:role/GitHubActions-EC2-Deploy
          aws-region: eu-north-1

      - name: Send deployment command to EC2
        run: |
          aws ssm send-command \
            --instance-ids i-08bff31980baf45ff \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["echo Deployment connection successful"]'
