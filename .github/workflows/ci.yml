name: Java Gradle CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Build application
        run: ./gradlew build

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v6
        with:
          name: java-gradle-app
          path: build/libs/*.jar

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v7
        with:
          name: java-gradle-app
          path: app

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::952652904046:role/GitHubActions-EC2-Deploy
          aws-region: eu-north-1
          role-session-name: GitHubActionsSession
          retry-max-attempts: 1
          mask-aws-account-id: false

      - name: Upload JAR to S3
        run: |
          aws s3 cp app/*.jar s3://java-gradle-devops-952652904046/java-gradle-app.jar

      - name: Check GitHub OIDC identity
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Repository ID: $GITHUB_REPOSITORY_ID"
          echo "Owner: $GITHUB_REPOSITORY_OWNER"
          echo "Ref: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"

      - name: Deploy application to EC2
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-08bff31980baf45ff \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["sudo mkdir -p /home/ubuntu/app","if [ -f /home/ubuntu/app/application.jar ]; then sudo cp /home/ubuntu/app/application.jar /home/ubuntu/app/application.jar.backup; fi","sudo aws s3 cp s3://java-gradle-devops-952652904046/java-gradle-app.jar /home/ubuntu/app/application.jar","sudo systemctl restart java-gradle-app","sleep 5","if curl -f http://localhost:8080; then echo \"Deployment successful\"; else echo \"Deployment failed - rolling back\"; sudo cp /home/ubuntu/app/application.jar.backup /home/ubuntu/app/application.jar; sudo systemctl restart java-gradle-app; exit 1; fi"]}' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-08bff31980baf45ff

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-08bff31980baf45ff
